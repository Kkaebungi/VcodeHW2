<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filtering Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style="display: flex; justify-content: center; align-items: center; gap: 8px;">
            <!-- CSS의 var(--accent-color)를 활용해 포인트 컬러인 Red가 적용되는 고양이 마스코트 SVG -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--accent-color)" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.93,4.93,19.22,9A7.83,7.83,0,0,1,20,13a8,8,0,0,1-16,0,7.83,7.83,0,0,1,.78-4L2.07,4.93a1,1,0,0,1,1.21-1.39l3.52,1.75A7.92,7.92,0,0,1,12,3a7.92,7.92,0,0,1,5.2,1.29l3.52-1.75A1,1,0,0,1,21.93,4.93ZM8,14a2,2,0,1,0-2-2A2,2,0,0,0,8,14Zm8,0a2,2,0,1,0-2-2A2,2,0,0,0,16,14Z"/>
            </svg>
            Image Filter 
            <span id="appVersion" style="font-size: 16px; color: var(--text-secondary); font-weight: normal; margin-left: 4px;"></span>
        </h1>
        <p class="subtitle">Upload, filter, and download your images</p>

        <!-- 이미지 업로드 -->
        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/jpeg, image/png, image/webp" hidden>
            <label for="imageInput" class="upload-btn">Choose Image</label>
            <span id="fileName">No file selected</span>
        </div>

        <!-- 필터 선택 -->
        <div class="filter-section">
            <label>Select Filter:</label>
            <select id="filterType">
                <option value="" disabled selected>Loading filters...</option>
            </select>
            <button id="applyBtn" class="action-btn" disabled>Apply Filter</button>
        </div>

        <!-- 결과 확인 및 다운로드 -->
        <div class="preview-section" id="previewSection" style="display: none;">
            <div class="image-container">
                <img id="resultImage" src="" alt="Filtered Result">
            </div>
            <button id="downloadBtn" class="action-btn outline">Download Image</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">Processing...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
