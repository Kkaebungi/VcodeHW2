name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Docker 레이어 캐싱을 위한 Buildx 설정 추가
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/image-filter-backend:latest
          # 빌드 캐시 설정 (빌드 속도 최적화)
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/image-filter-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/image-filter-backend:buildcache,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/image-filter-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/image-filter-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/image-filter-frontend:buildcache,mode=max

      - name: Deploy to Self-hosted
        run: |
          # 기존 로컬에서 띄워진 컨테이너들과 포트 충돌을 피하기 위해 먼저 다운시킵니다 (옵션)
          docker compose -p image-filtering-service down || true
          docker compose -p image-filtering-service up -d --build
